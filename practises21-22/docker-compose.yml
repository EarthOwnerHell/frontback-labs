version: "3.8"

services:
  redis:
    image: redis:7-alpine

  backend1:
    build: ./server
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-1
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis

  backend2:
    build: ./server
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-2
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  backend3:
    build: ./server
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-3-backup
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  haproxy:
    image: haproxy:3.0-alpine
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "8081:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
